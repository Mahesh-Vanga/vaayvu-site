services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      VAAYVU_DOMAIN: ${VAAYVU_DOMAIN:?Set VAAYVU_DOMAIN to your sync hostname in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  sync:
    image: node:22-bookworm-slim
    user: node
    command: ["node", "/opt/vaayvu/server.mjs"]
    restart: unless-stopped
    network_mode: service:proxy
    depends_on:
      proxy:
        condition: service_started
        restart: true
    environment:
      HOST: 127.0.0.1
      PORT: "8787"
      SYNC_DB: /home/node/vaayvu/vaayvu.sqlite
      VAAYVU_REGISTRATION: ${VAAYVU_REGISTRATION:-open}
      VAAYVU_REGISTRATION: ${VAAYVU_REGISTRATION:-}
      VAAYVU_OLLAMA_URL: ${VAAYVU_OLLAMA_URL:-}
      VAAYVU_OLLAMA_URL: ${VAAYVU_OLLAMA_URL:-}
      VAAYVU_OLLAMA_MODEL: ${VAAYVU_OLLAMA_MODEL:-}
      VAAYVU_OLLAMA_MODEL: ${VAAYVU_OLLAMA_MODEL:-}
    volumes:
      - ../server.mjs:/opt/vaayvu/server.mjs:ro
      - sync_data:/home/node

volumes:
  caddy_data:
  caddy_config:
  sync_data:
