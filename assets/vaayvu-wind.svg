<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16384" height="16384" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Vaayvu — Vayu wind app icon</title>
  <desc id="desc">A blue V with flowing cyan and white ribbons on a warm ivory rounded-square tile. Transparent outside the tile. Fully vector artwork.</desc>
  <defs>
    <!-- Rounded-square tile; all light effects are vector gradients. -->
    <path id="tileShape" d="M380 98 H866 C1034 98 1159 211 1159 382 V897 C1159 1072 1055 1186 879 1186 H366 C190 1186 79 1073 79 902 V384 C79 210 193 98 380 98 Z"/>
    <clipPath id="tileClip"><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#tileShape"/></clipPath>
    <linearGradient id="tileBase" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbf0e6"/><stop offset=".35" stop-color="#f8f4f2"/><stop offset=".66" stop-color="#f3eeee"/><stop offset="1" stop-color="#e9e6f0"/>
    </linearGradient>
    <radialGradient id="warmTop" cx=".11" cy=".055" r=".46">
      <stop stop-color="#ffdea0" stop-opacity=".78"/><stop offset=".48" stop-color="#ffe5bf" stop-opacity=".43"/><stop offset="1" stop-color="#ffe9cd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmBottom" cx=".09" cy=".91" r=".56">
      <stop stop-color="#e9c8b7" stop-opacity=".27"/><stop offset="1" stop-color="#e9c8b7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerLight" cx=".47" cy=".49" r=".61">
      <stop stop-color="#ffffff" stop-opacity=".65"/><stop offset=".58" stop-color="#ffffff" stop-opacity=".26"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coolBottom" cx=".85" cy=".94" r=".62">
      <stop stop-color="#dcdbea" stop-opacity=".48"/><stop offset="1" stop-color="#dcdbea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1=".15" y1="0" x2=".82" y2="1">
      <stop stop-color="#fffdf4"/><stop offset=".27" stop-color="#fffaf5"/><stop offset=".55" stop-color="#eee2da"/><stop offset=".78" stop-color="#dacdcb"/><stop offset="1" stop-color="#dedce6"/>
    </linearGradient>
    <linearGradient id="innerRim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffdfa" stop-opacity=".95"/><stop offset=".22" stop-color="#ffffff" stop-opacity=".45"/><stop offset=".6" stop-color="#ffffff" stop-opacity=".05"/><stop offset="1" stop-color="#ffffff" stop-opacity=".72"/>
    </linearGradient>
    <path id="vShape" d="M219 367 H408 C452 367 475 391 495 433 L573 597 L672 425 C694 387 720 367 761 367 H941 C959 367 974 381 963 400 L654 953 C640 977 621 991 594 991 H534 C507 991 484 976 469 950 L191 410 C178 388 184 367 219 367 Z"/>
    <clipPath id="vClip"><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#vShape"/></clipPath>
    <linearGradient id="vLeft" gradientUnits="userSpaceOnUse" x1="275" y1="365" x2="450" y2="832">
      <stop stop-color="#00dafa"/><stop offset=".20" stop-color="#009afa"/><stop offset=".44" stop-color="#0060f2"/><stop offset=".65" stop-color="#1232da"/><stop offset=".83" stop-color="#2915c8"/><stop offset="1" stop-color="#7841ff"/>
    </linearGradient>
    <radialGradient id="vLeftShade" gradientUnits="userSpaceOnUse" cx="560" cy="620" r="220">
      <stop stop-color="#06166e" stop-opacity=".94"/><stop offset=".43" stop-color="#08198f" stop-opacity=".62"/><stop offset="1" stop-color="#06166e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vRight" gradientUnits="userSpaceOnUse" x1="872" y1="372" x2="633" y2="639">
      <stop stop-color="#00c5f5"/><stop offset=".30" stop-color="#007ef3"/><stop offset=".61" stop-color="#004cdd"/><stop offset=".83" stop-color="#0632ad"/><stop offset="1" stop-color="#08196c"/>
    </linearGradient>
    <linearGradient id="vBottom" gradientUnits="userSpaceOnUse" x1="540" y1="784" x2="607" y2="987">
      <stop stop-color="#00146e"/><stop offset=".27" stop-color="#0632bd"/><stop offset=".59" stop-color="#2354f6"/><stop offset="1" stop-color="#5b6dfb"/>
    </linearGradient>
    <radialGradient id="violetFoot" gradientUnits="userSpaceOnUse" cx="485" cy="966" r="171">
      <stop stop-color="#713aff" stop-opacity=".94"/><stop offset=".6" stop-color="#5733fe" stop-opacity=".48"/><stop offset="1" stop-color="#5733fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="upperWind" gradientUnits="userSpaceOnUse" x1="493" y1="757" x2="1044" y2="470">
      <stop stop-color="#009ff4"/><stop offset=".33" stop-color="#00b6f7"/><stop offset=".70" stop-color="#00cef5"/><stop offset="1" stop-color="#00d7ef"/>
    </linearGradient>
    <linearGradient id="upperShine" gradientUnits="userSpaceOnUse" x1="550" y1="690" x2="1049" y2="461">
      <stop stop-color="#00bdfb"/><stop offset=".27" stop-color="#c5f3fa"/><stop offset=".48" stop-color="#e0fbff"/><stop offset=".71" stop-color="#83f5ff"/><stop offset="1" stop-color="#00f2f1"/>
    </linearGradient>
    <linearGradient id="whiteWind" gradientUnits="userSpaceOnUse" x1="480" y1="770" x2="993" y2="631">
      <stop stop-color="#fffdfd"/><stop offset=".30" stop-color="#f4f8fc"/><stop offset=".61" stop-color="#cddff8"/><stop offset=".84" stop-color="#e8f4ff"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="lowerWind" gradientUnits="userSpaceOnUse" x1="625" y1="708" x2="661" y2="812">
      <stop stop-color="#0068de"/><stop offset=".35" stop-color="#008cfa"/><stop offset=".74" stop-color="#00d4f7"/><stop offset="1" stop-color="#00ebf4"/>
    </linearGradient>
    <linearGradient id="windCurl" gradientUnits="userSpaceOnUse" x1="434" y1="886" x2="528" y2="756">
      <stop stop-color="#4bdbf0"/><stop offset=".50" stop-color="#4ef1fa"/><stop offset="1" stop-color="#13d4fa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- The exterior is deliberately transparent: no background rectangle. -->
  <g id="ivory-tile">
    <use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#tileShape" fill="url(#tileBase)"/>
    <g clip-path="url(#tileClip)">
      <rect x="79" y="98" width="1080" height="1088" fill="url(#warmTop)"/>
      <rect x="79" y="98" width="1080" height="1088" fill="url(#warmBottom)"/>
      <rect x="79" y="98" width="1080" height="1088" fill="url(#coolBottom)"/>
      <rect x="79" y="98" width="1080" height="1088" fill="url(#centerLight)"/>
      <use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#tileShape" fill="none" stroke="#dccbc5" stroke-opacity=".10" stroke-width="22"/>
      <use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#tileShape" fill="none" stroke="url(#innerRim)" stroke-width="11"/>
    </g>
    <use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#tileShape" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
  </g>

  <!-- The V monogram: original silhouette, separate blue gradient layers. -->
  <g id="vaayvu-v" clip-path="url(#vClip)">
    <rect x="175" y="360" width="800" height="640" fill="url(#vLeft)"/>
    <rect x="175" y="360" width="800" height="640" fill="url(#vLeftShade)"/>
    <path d="M573 597 L672 425 C694 387 720 367 761 367 H941 C959 367 974 381 963 400 L654 953 C640 977 621 991 594 991 H534 C507 991 484 976 469 950 L405 832 Z" fill="url(#vRight)"/>
    <path d="M416 863 C459 779 575 746 795 731 L804 1000 H396 Z" fill="url(#vBottom)"/>
    <path d="M416 863 C459 779 575 746 795 731 L804 1000 H396 Z" fill="url(#violetFoot)"/>
  </g>

  <!-- Three flowing wind bands, with a clean continuous folded curl. -->
  <g id="vayu-wind-ribbons">
    <path id="upper-band" d="M405 822 C389 769 435 711 508 657 C602 587 717 540 844 538 C956 536 1034 498 1053 389 C1084 472 1076 552 1018 599 C956 649 876 656 766 657 C645 658 543 664 470 716 C420 751 402 786 405 822 Z" fill="url(#upperWind)"/>
    <path id="upper-light" d="M418 749 C451 711 478 679 508 657 C602 587 717 540 844 538 C956 536 1034 498 1053 389 C1065 467 1037 522 982 555 C935 584 876 598 783 599 C637 599 501 651 418 749 Z" fill="url(#upperShine)"/>
    <path id="white-band" d="M445 908 C426 881 397 842 403 792 C410 733 472 691 554 673 C624 655 706 657 773 657 C886 656 982 642 1031 604 C1002 659 948 680 887 692 C812 707 743 711 675 715 C554 723 480 749 438 799 C411 832 424 879 445 908 Z" fill="url(#whiteWind)"/>
    <path id="lower-band" d="M445 908 C424 879 411 832 438 799 C480 749 554 723 675 715 C743 711 812 707 887 692 C948 680 1002 659 1031 604 C1006 664 955 709 892 731 C821 755 735 757 665 765 C552 778 476 804 449 848 C437 867 440 890 445 908 Z" fill="url(#lowerWind)"/>
    <path id="curl-highlight" d="M445 908 C424 879 411 832 438 799 C459 774 490 756 529 743 C478 770 451 803 444 839 C439 860 439 887 445 908 Z" fill="url(#windCurl)"/>
  </g>
</svg>
