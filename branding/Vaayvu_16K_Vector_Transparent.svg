  <path d="M158 243H1097C1136 243 1164 277 1164 327V981C1164 1074 1105 1139 1021 1139H187C133 1139 92 1093 92 989V304C92 269 119 243 158 243Z" fill="none" stroke="url(#paperEdge)" stroke-width="2.8"/>
