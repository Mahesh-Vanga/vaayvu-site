<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16384" height="16384" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
<title id="title">Vaayvu Browser app icon</title>
<desc id="desc">Vector recreation of the supplied browser icon, with tabbed window, address bar, blue V and cyan wind ribbons. All artwork uses editable vector shapes and gradients.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="47%" r="72%"><stop stop-color="#21045f"/><stop offset="1" stop-color="#140345"/></radialGradient>
  <linearGradient id="rearTab" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#ead8cc"/><stop offset="0.45" stop-color="#d7c4be"/><stop offset="1" stop-color="#ad9fa8"/></linearGradient>
  <linearGradient id="frontTab" x1="0" y1="0.15" x2="1" y2="0.8"><stop stop-color="#ff9b59"/><stop offset="0.48" stop-color="#ff7c50"/><stop offset="1" stop-color="#f65046"/></linearGradient>
  <linearGradient id="tabEdge" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#ffe3b9"/><stop offset="1" stop-color="#ff9a75" stop-opacity="0"/></linearGradient>
  <linearGradient id="paper" x1="0.15" y1="0" x2="0.65" y2="1"><stop stop-color="#fff3e2"/><stop offset="0.29" stop-color="#fdf5e9"/><stop offset="0.58" stop-color="#fefaf4"/><stop offset="1" stop-color="#fdf2e3"/></linearGradient>
  <radialGradient id="paperWarm" cx="91%" cy="25%" r="69%"><stop stop-color="#ecd6bc" stop-opacity=".28"/><stop offset="1" stop-color="#f5e7d9" stop-opacity="0"/></radialGradient>
  <linearGradient id="paperEdge" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fffdf7"/><stop offset=".8" stop-color="#fffaf4" stop-opacity=".5"/><stop offset="1" stop-color="#d3c4b6" stop-opacity=".3"/></linearGradient>
  <linearGradient id="corner" x1="0.06" y1="0.25" x2=".97" y2=".85"><stop stop-color="#0054e5"/><stop offset=".42" stop-color="#008df6"/><stop offset=".7" stop-color="#0078fb"/><stop offset="1" stop-color="#003cec"/></linearGradient>
  <radialGradient id="cornerLight" cx="62%" cy="38%" r="64%"><stop stop-color="#02c5ff" stop-opacity=".5"/><stop offset="1" stop-color="#0054ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="address" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#faf3eb"/></linearGradient>
  <linearGradient id="leftV" x1=".13" y1="0" x2=".69" y2="1"><stop stop-color="#00b2fa"/><stop offset=".27" stop-color="#007ff8"/><stop offset=".55" stop-color="#0642e0"/><stop offset=".79" stop-color="#11139b"/><stop offset="1" stop-color="#3426dc"/></linearGradient>
  <linearGradient id="rightV" x1=".93" y1="0" x2=".18" y2=".89"><stop stop-color="#008cfa"/><stop offset=".28" stop-color="#0064ed"/><stop offset=".53" stop-color="#0026a9"/><stop offset=".76" stop-color="#07167b"/><stop offset="1" stop-color="#1451f5"/></linearGradient>
  <linearGradient id="vBottom" x1=".13" y1=".08" x2=".77" y2=".93"><stop stop-color="#00126e"/><stop offset=".42" stop-color="#0639db"/><stop offset=".78" stop-color="#075cfb"/><stop offset="1" stop-color="#1759f9"/></linearGradient>
  <linearGradient id="topAir" x1=".05" y1=".95" x2=".94" y2=".05"><stop stop-color="#0063df"/><stop offset=".4" stop-color="#00b8f8"/><stop offset=".72" stop-color="#00ddfa"/><stop offset="1" stop-color="#00edfc"/></linearGradient>
  <linearGradient id="topHighlight" x1=".22" y1=".88" x2=".92" y2=".16"><stop stop-color="#7eeaff" stop-opacity="0"/><stop offset=".40" stop-color="#d8ffff"/><stop offset=".73" stop-color="#8ffcff"/><stop offset="1" stop-color="#00f3ff"/></linearGradient>
  <linearGradient id="whiteAir" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#eafaff"/><stop offset=".38" stop-color="#fffefa"/><stop offset="1" stop-color="#fffaf0"/></linearGradient>
  <linearGradient id="lowerAir" x1=".1" y1=".95" x2=".68" y2=".1"><stop stop-color="#04e1f8"/><stop offset=".28" stop-color="#00c9f9"/><stop offset=".57" stop-color="#0097fb"/><stop offset="1" stop-color="#0066e8"/></linearGradient>
  <linearGradient id="lowerEdge" x1=".05" y1=".95" x2=".9" y2=".05"><stop stop-color="#a5fdff"/><stop offset=".35" stop-color="#12e0fc"/><stop offset=".76" stop-color="#00b5fa"/><stop offset="1" stop-color="#0084f0"/></linearGradient>
  <clipPath id="windowClip"><path d="M158 243H1097C1136 243 1164 277 1164 327V981C1164 1074 1105 1139 1021 1139H187C133 1139 92 1093 92 989V304C92 269 119 243 158 243Z"/></clipPath>
